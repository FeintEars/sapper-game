<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Minesweeper</title>
<style>
  body { 
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
    display: flex; flex-direction: column; align-items: center; 
    background: #1e1e1e; color: #ffffff; 
    margin-top: 30px; user-select: none; 
    touch-action: manipulation;
  }
  #board { 
    display: grid; gap: 2px; background: #555; 
    border: 3px solid #333; padding: 2px; border-radius: 4px;
  }
  .cell { 
    width: 35px; height: 35px; background: #bdbdbd; 
    display: flex; align-items: center; justify-content: center; 
    font-weight: bold; font-size: 20px; cursor: pointer; color: #000; 
    box-shadow: inset -2px -2px #7a7a7a, inset 2px 2px #fff; 
  }
  .cell.revealed { 
    background: #e0e0e0; box-shadow: inset 1px 1px #9e9e9e; 
  }
  .cell.mine { background: #f44336; }
  .cell.flag { background: #bdbdbd; }
  
  .n1 { color: #1976d2; } .n2 { color: #388e3c; } 
  .n3 { color: #d32f2f; } .n4 { color: #303f9f; } 
  .n5 { color: #7b1fa2; } .n6 { color: #0097a7; } 
  .n7 { color: #212121; } .n8 { color: #757575; }
  
  #status { margin-bottom: 20px; font-size: 28px; font-weight: bold; }
  .controls { margin-bottom: 15px; font-size: 16px; color: #aaa; text-align: center; }
  button { 
    margin-top: 25px; padding: 12px 24px; font-size: 18px; 
    background: #4caf50; color: white; border: none; 
    border-radius: 5px; cursor: pointer; font-weight: bold;
  }
  button:active { background: #388e3c; }
</style>
</head>
<body>
  <div id="status">Minesweeper 💣</div>
  <div class="controls">
    Click to reveal<br>
    Long press (or right-click) for flag 🚩
  </div>
  <div id="board"></div>
  <button onclick="init()">New Game</button>

  <script>
    const ROWS = 10, COLS = 10, MINES = 15;
    let board = [], gameOver = false;

    function init() {
      gameOver = false;
      board = Array.from({length: ROWS}, () => Array.from({length: COLS}, () => ({isMine: false, revealed: false, flagged: false, count: 0})));
      document.getElementById('status').innerText = 'Minesweeper 💣';
      
      let minesPlaced = 0;
      while(minesPlaced < MINES) {
        let r = Math.floor(Math.random() * ROWS);
        let c = Math.floor(Math.random() * COLS);
        if(!board[r][c].isMine) {
          board[r][c].isMine = true;
          minesPlaced++;
        }
      }

      for(let r = 0; r < ROWS; r++) {
        for(let c = 0; c < COLS; c++) {
          if(!board[r][c].isMine) {
            let count = 0;
            for(let i = -1; i <= 1; i++) {
              for(let j = -1; j <= 1; j++) {
                if(r+i >= 0 && r+i < ROWS && c+j >= 0 && c+j < COLS && board[r+i][c+j].isMine) count++;
              }
            }
            board[r][c].count = count;
          }
        }
      }
      render();
    }

    function render() {
      const b = document.getElementById('board');
      b.style.gridTemplateColumns = `repeat(${COLS}, 35px)`;
      b.innerHTML = '';
      for(let r = 0; r < ROWS; r++) {
        for(let c = 0; c < COLS; c++) {
          let cell = document.createElement('div');
          cell.className = 'cell';
          
          cell.oncontextmenu = (e) => { e.preventDefault(); toggleFlag(r, c); };
          cell.onclick = () => reveal(r, c);
          
          let timer;
          cell.addEventListener('touchstart', (e) => {
             timer = setTimeout(() => { timer = null; toggleFlag(r, c); }, 400);
          });
          cell.addEventListener('touchend', () => { if(timer) clearTimeout(timer); });
          cell.addEventListener('touchmove', () => { if(timer) clearTimeout(timer); });

          if(board[r][c].revealed) {
            cell.classList.add('revealed');
            if(board[r][c].isMine) {
              cell.classList.add('mine');
              cell.innerText = '💣';
            } else if(board[r][c].count > 0) {
              cell.innerText = board[r][c].count;
              cell.classList.add('n' + board[r][c].count);
            }
          } else if(board[r][c].flagged) {
            cell.innerText = '🚩';
          }
          b.appendChild(cell);
        }
      }
    }

    function toggleFlag(r, c) {
      if(gameOver || board[r][c].revealed) return;
      board[r][c].flagged = !board[r][c].flagged;
      render();
    }

    function reveal(r, c) {
      if(gameOver || board[r][c].revealed || board[r][c].flagged) return;
      board[r][c].revealed = true;
      
      if(board[r][c].isMine) {
        gameOver = true;
        document.getElementById('status').innerText = '💥 Boom! You lost.';
        revealAll();
        return;
      }
      
      if(board[r][c].count === 0) {
        for(let i = -1; i <= 1; i++) {
          for(let j = -1; j <= 1; j++) {
            if(r+i >= 0 && r+i < ROWS && c+j >= 0 && c+j < COLS) reveal(r+i, c+j);
          }
        }
      }
      
      checkWin();
      render();
    }

    function revealAll() {
      for(let r = 0; r < ROWS; r++) {
        for(let c = 0; c < COLS; c++) {
          board[r][c].revealed = true;
        }
      }
      render();
    }

    function checkWin() {
      let won = true;
      for(let r = 0; r < ROWS; r++) {
        for(let c = 0; c < COLS; c++) {
          if(!board[r][c].isMine && !board[r][c].revealed) won = false;
        }
      }
      if(won) {
        gameOver = true;
        document.getElementById('status').innerText = '🎉 Victory!';
      }
    }

    init();
  </script>
</body>
</html>
