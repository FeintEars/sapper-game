<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>15 Puzzle</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', Tahoma, sans-serif;
    display: flex; flex-direction: column; align-items: center;
    background: #1e1e1e; color: #fff; margin-top: 30px; user-select: none;
  }
  #puzzle { display: grid; grid-template-columns: repeat(4, 80px); gap: 4px; background: #333; padding: 6px; border-radius: 8px; }
  .tile {
    width: 76px; height: 76px; border-radius: 6px;
    display: flex; align-items: center; justify-content: center;
    font-size: 30px; font-weight: bold; cursor: pointer;
    background: linear-gradient(145deg, #4caf50, #2e7d32); color: #fff;
    box-shadow: 0 3px 6px rgba(0,0,0,.4);
    transition: transform .1s;
  }
  .tile.empty { background: transparent; box-shadow: none; cursor: default; }
  #status { font-size: 22px; margin-bottom: 20px; font-weight: bold; }
  button { margin-top: 25px; padding: 12px 26px; font-size: 18px; background: #ff9800; color: #fff; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; }
  button:active { background: #e65100; }
  .moves { color: #aaa; font-size: 15px; margin-top: 12px; }
</style>
</head>
<body>
  <div id="status">15 Puzzle 🧩</div>
  <div id="puzzle"></div>
  <div class="moves" id="moves">Moves: 0</div>
  <button onclick="init()">Shuffle</button>

<script>
  const SIZE = 4;
  let board = [], gameOver = false, moveCount = 0;

  function init() {
    gameOver = false; moveCount = 0;
    document.getElementById('moves').innerText = 'Moves: 0';
    board = [];
    for (let i = 1; i < SIZE*SIZE; i++) board.push(i);
    board.push(0); // 0 = empty
    shuffle();
    render();
  }

  function shuffle() {
    for (let i = board.length-1; i > 0; i--) {
      let j = Math.floor(Math.random()*(i+1));
      [board[i], board[j]] = [board[j], board[i]];
    }
    // Ensure solvable: swap if inversion count is odd
    if (!isSolvable()) {
      for (let i = 0; i < board.length; i++) {
        if (board[i] !== 0 && board[i+1] !== 0) { [board[i], board[i+1]] = [board[i+1], board[i]]; break; }
      }
    }
  }

  function isSolvable() {
    let inversions = 0, flat = board.filter(n => n !== 0);
    for (let i = 0; i < flat.length; i++)
      for (let j = i+1; j < flat.length; j++)
        if (flat[i] > flat[j]) inversions++;
    let emptyRow = SIZE - Math.floor(board.indexOf(0) / SIZE);
    return (inversions % 2 === 0) === (emptyRow % 2 === 1);
  }

  function render() {
    const p = document.getElementById('puzzle');
    p.innerHTML = '';
    board.forEach((val, idx) => {
      let t = document.createElement('div');
      t.className = 'tile' + (val === 0 ? ' empty' : '');
      t.innerText = val === 0 ? '' : val;
      t.onclick = () => clickTile(idx);
      p.appendChild(t);
    });
  }

  function clickTile(idx) {
    if (gameOver) return;
    const empty = board.indexOf(0);
    const r = Math.floor(idx / SIZE), c = idx % SIZE;
    const er = Math.floor(empty / SIZE), ec = empty % SIZE;
    if (Math.abs(r-er) + Math.abs(c-ec) !== 1) return;
    [board[idx], board[empty]] = [board[empty], board[idx]];
    moveCount++;
    document.getElementById('moves').innerText = 'Moves: ' + moveCount;
    render();
    checkWin();
  }

  function checkWin() {
    for (let i = 0; i < SIZE*SIZE-1; i++) {
      if (board[i] !== i+1) return;
    }
    gameOver = true;
    document.getElementById('status').innerText = '🎉 You win in ' + moveCount + ' moves!';
  }

  init();
</script>
</body>
</html>
